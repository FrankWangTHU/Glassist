name: Build and test WidgetKit
on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test local signing renewal safeguards
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Test API, dates and widget storage
        run: swift test
      - name: Build host and embedded WidgetKit extension
        run: bash scripts/build-app.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Glassist-WidgetKit-UNSIGNED
          path: dist/Glassist-WidgetKit-UNSIGNED.zip
